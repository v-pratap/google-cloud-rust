language       = "C"
include_guard  = "GCS_CORE_H"
cpp_compat     = true
usize_is_size_t = true
documentation  = true
autogen_warning = "/* Generated by cbindgen from rust/src/lib.rs. Do not edit by hand. */"
sys_includes   = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes    = true

[export]
include = ["GcsStatus", "GcsObjectMetadata", "GcsClientOptions"]
